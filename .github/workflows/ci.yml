name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Authenticated tests activate only when both development-instance secrets exist.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_E2E_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuYWNjb3VudHMuZGV2JA' }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_E2E_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_E2E_SECRET_KEY }}
      CLERK_E2E_CONFIGURED: ${{ secrets.CLERK_E2E_PUBLISHABLE_KEY != '' && secrets.CLERK_E2E_SECRET_KEY != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Test
        run: npm run test:unit

      - name: Install browser for E2E tests
        run: npx playwright install --with-deps chromium

      - name: Browser journeys and accessibility
        run: npm run test:e2e

      - name: Authenticated progress sync and account deletion
        if: env.CLERK_E2E_CONFIGURED == 'true'
        run: npm run test:e2e:auth

      - name: Authenticated E2E setup notice
        if: env.CLERK_E2E_CONFIGURED != 'true'
        run: echo "::notice::Authenticated E2E is ready and will activate after CLERK_E2E_PUBLISHABLE_KEY and CLERK_E2E_SECRET_KEY are added as repository secrets."

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
